[project]
name = "nnintro"
version = "0.1.0"
description = "Offline asset pipeline for the dense neural network explorer"
readme = "README.md"
authors = [
    { name = "David Kirkby", email = "dkirkby@uci.edu" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1",
    "torch>=2.4",
]

[project.scripts]
nnintro = "nnintro.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
